services:
  neo4j:
    image: neo4j:5.26-community
    container_name: idea-office-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"   # browser UI
      - "127.0.0.1:7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  server:
    build: { context: ., target: server }
    restart: unless-stopped
    depends_on:
      neo4j: { condition: service_healthy }
    env_file: .env                       # API keys and models; never baked into the image
    environment:
      HOST: 0.0.0.0                      # reachable by the web container only: no port is published
      PORT: 8787
      NEO4J_URI: bolt://neo4j:7687
      TZ: ${TZ:-Asia/Kolkata}            # the daily token budget and backups follow this clock
    volumes:
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/settings').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    depends_on:
      server: { condition: service_healthy }
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"   # this machine only: the app has no login

volumes:
  neo4j_data:
